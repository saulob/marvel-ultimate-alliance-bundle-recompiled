# ReXGlue runtime settings, read from <exe dir>/marvel_ultimate_alliance.toml.
# The launcher writes the player's choices to <user data>/settings.toml, which is loaded after this file.
gpu_plugin = "xenos"

# Keyboard emulates the Xbox 360 pad next to a connected controller, with ReXGlue's default bindings.
mnk_mode = true
# Empty skips the optional gamecontrollerdb.txt load; SDL's built-in mappings still apply.
hid_mappings_file = ""

# ReXGlue's compatibility option: use texture fetch constants of invalid type instead of rejecting the fetch.
gpu_allow_invalid_fetch_constants = true

# EDRAM in pixel shaders (rasterizer-ordered views on Direct3D 12, fragment shader interlock on Vulkan) instead of host
# render targets, whose EDRAM dumps lose the movie render target. ReXGlue falls back to host render targets on GPUs
# without them.
render_target_path_d3d12 = "rov"
render_target_path_vulkan = "fsi"
# A frame may wait this long in total for pipelines prepared in the background before drawing without them (patch 0048).
# The game sets it from the Frame rate choice: half a frame at the cap, 16 ms at 30 FPS down to 4 ms.
async_shader_wait_ms = 16

# Default game window: 853x480 logical, centered on the primary display. Logical pixels are scaled by the display scale.
fullscreen = false
monitor = 1
window_width = 853
window_height = 480

# Audio queue depth in frames (ReXGlue default 8): keeps audio from falling behind in busy scenes, about 43 ms more
# latency. A value in the launcher's settings.toml takes precedence.
audio_maxqframes = 16
