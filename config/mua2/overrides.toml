# Manual analysis fixes for Marvel Ultimate Alliance 2 (default.xex, title 4156082F)

[functions]
# Leaf bodies with no .pdata entry that follow a this-adjusting thunk (addi r3, r3, 12; b) and are reached only by its tail call.
0x8258E118 = { end = 0x8258E1B4 }
0x8258E1C0 = { end = 0x8258E25C }
0x825C7308 = { end = 0x825C73B4 }
0x8266FCF8 = { end = 0x8266FD94 }
0x82693BB8 = { end = 0x82693C54 }
0x82693EA0 = { end = 0x82693F3C }
0x82693F48 = { end = 0x82693FF4 }
0x826FECF8 = { end = 0x826FED94 }
0x826FEDA0 = { end = 0x826FEE3C }
0x82775F28 = { end = 0x82775FC4 }
0x8279C578 = { end = 0x8279C614 }
0x827F2F38 = { end = 0x827F2FD4 }
0x827F2FE0 = { end = 0x827F307C }
0x827F3088 = { end = 0x827F3124 }
0x8289D558 = { end = 0x8289D5F4 }
0x8289D600 = { end = 0x8289D69C }
0x8289D810 = { end = 0x8289D8A8 }
0x82941AA8 = { end = 0x82941B44 }

# Vtable-slot thunks (lwz r11, 0(r3); lwz r10, slot(r11); mtctr r10; bctr) and a flag setter, reached by tail calls.
0x82783A58 = { end = 0x82783A68 }
0x82783A68 = { end = 0x82783A78 }
0x82783A78 = { end = 0x82783A88 }
0x82783A88 = { end = 0x82783AA4 }

# Thunk (addi r3, r3, 8; b) reached by a tail call from the adjacent thunk.
0x82A08CE0 = { end = 0x82A08CE8 }

# Setter reached by a tail call from between two functions.
0x82A22410 = { end = 0x82A22438 }

# Sanitizes the mixed frame before XAudioSubmitRenderDriverFrame in sub_82A25E50; r4 is the frame address.
[[midasm_hook]]
address = 0x82A25F14
name = "mua_audio_pcm_firewall"
registers = ["r4"]
after_instruction = false

# Sizes the back buffer in sub_8252D400 for the Aspect Ratio choice; r11 and r10 hold the HD back buffer size.
[[midasm_hook]]
address = 0x8252D4EC
name = "mua_aspect_back_buffer"
registers = ["r11", "r10"]
after_instruction = false

# Gives the display aspect stored by sub_8252D400 the format's width over height; f13 holds the title's 16:9.
[[midasm_hook]]
address = 0x8252D55C
name = "mua_aspect_display_aspect"
registers = ["f13"]
after_instruction = false

# Decides whether to RunScript("menus/intro_normal") in sub_8252A550; r31 is 0 when the publisher/startup
# presentation script has not run yet, read right after a cvar lookup keyed by a per-profile string.
[[midasm_hook]]
address = 0x8252A72C
name = "mua_skip_intro_mua2"
registers = ["r31"]
after_instruction = false

# Keeps the Upscaling back buffer for the device presentation params in sub_82271DF8's display-mode scan, where a
# back buffer matching no supported mode falls back to the video mode in r7 and r8; same shape as MUA1/Gold, just
# with different register allocation (r8/r9 there).
[[midasm_hook]]
address = 0x82272074
name = "mua_upscale_device_back_buffer"
registers = ["r7", "r8"]
after_instruction = false

# Gives the pause menu Statistics title of a primary player that is not signed in its user's name in sub_82919468
# (Lua getCategoryList), right after "Player %d Statistics" is formatted; r31 holds the title string's frame and r28 the
# player's port.
[[midasm_hook]]
address = 0x82919550
name = "mua_player_stats_name"
registers = ["r31", "r28"]
after_instruction = false

# Lowers the 10 ms floor of the wall-clock step in the game clock's update sub_827ECB38 to the clock's own 10 us floor;
# f0 holds the floor for the fsubs/fsel that apply it.
[[midasm_hook]]
address = 0x827ECCB0
name = "mua_clock_step_floor_mua2"
registers = ["f0"]
after_instruction = false

# The atomic sections of the job scheduler (sub_822EC940, sub_822EC478), its spin lock (sub_822EB1E0) and its block
# allocator (sub_822EB4F0, sub_822EB5C8, sub_822EB6B8, sub_822EB7E0, sub_822EBAF0), run as native atomics without the
# global interrupt lock: each hook sits on the section's mfmsr and returns true to skip to the instruction after it.
[[midasm_hook]]
address = 0x822EB228
name = "mua_atomic_cas64_mua2"
registers = ["r8", "r9", "r31", "r28", "r10", "cr6", "cr0", "xer", "reserved"]
jump_address_on_true = 0x822EB254

