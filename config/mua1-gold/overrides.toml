# Manual analysis fixes for Marvel Ultimate Alliance Gold Edition (default.xex, title 415607DA)

[functions]
# Leaf bodies with no .pdata entry that follow a this-adjusting thunk (addi r3, r3, 12; b) and are reached only by its tail call.
0x8217E500 = { end = 0x8217E59C }
0x82261000 = { end = 0x8226109C }
0x82263298 = { end = 0x82263334 }
0x82263340 = { end = 0x822633DC }
0x8227A1B8 = { end = 0x8227A254 }
0x8227A260 = { end = 0x8227A2FC }
0x8227A3A8 = { end = 0x8227A454 }
0x82328E10 = { end = 0x82328EAC }
0x82358D18 = { end = 0x82358DB4 }
0x823B2748 = { end = 0x823B27E4 }
0x823EAFB0 = { end = 0x823EB04C }

# Tail-call target between two .pdata functions: loads a pointer, returns early on null, else jumps through a table slot.
0x8263BB78 = { end = 0x8263BB98 }

# Vcall thunk followed by a function that no pointer or branch starts; GapFill split it at the blr of its early-exit path.
0x82543C70 = { end = 0x82543C80 }
0x82543C80 = { end = 0x82543D1C }

# Sanitizes the mixed frame before XAudioSubmitRenderDriverFrame in sub_824AF110; r4 is the frame address.
[[midasm_hook]]
address = 0x824AF158
name = "mua_audio_pcm_firewall"
registers = ["r4"]
after_instruction = false

# The rendezvous spin in sub_824A6BA8 (XAudio mix workers) has no kernel wait, so title termination cannot stop it.
[[midasm_hook]]
address = 0x824A6C84
name = "mua_audio_barrier_escape"
registers = []
after_instruction = false
return_on_true = true

# Sizes the back buffer in sub_82455AB0 for the Aspect Ratio choice; r11 and r10 hold the HD back buffer size.
[[midasm_hook]]
address = 0x82455C30
name = "mua_aspect_back_buffer"
registers = ["r11", "r10"]
after_instruction = false

# Gives the display aspect stored by sub_82455AB0 the format's width over height; f13 holds the title's 16:9.
[[midasm_hook]]
address = 0x82455CB4
name = "mua_aspect_display_aspect"
registers = ["f13"]
after_instruction = false

# Keeps the Upscaling back buffer for the D3D device where sub_825186D0 falls back to the video mode in r8 and r9.
[[midasm_hook]]
address = 0x8251891C
name = "mua_upscale_device_back_buffer"
registers = ["r8", "r9"]
after_instruction = false

# Gives the Players list row of an active controller its user's name in sub_82410C18; r1 holds the row's port digit and text.
[[midasm_hook]]
address = 0x82410D68
name = "mua_player_list_name"
registers = ["r1"]
after_instruction = false
